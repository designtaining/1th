<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-1Thin.woff2') format('woff2');
            font-weight: 100;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-2ExtraLight.woff2') format('woff2');
            font-weight: 200;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-3Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-4Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-5Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-6SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-8ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }

        @font-face {
            font-family: 'A2z';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-9Black.woff2') format('woff2');
            font-weight: 900;
            font-display: swap;
        }

        .surve_container {
            width: 100%;
            height: 100vh;
        }

        .surve_wrapper {
            width: 100%;
            height: 100%;
        }

        .surve_box {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 120px 0;
        }

        .surve_top {
            display: flex;
            flex-direction: column;
            gap: 60px;
            align-items: center;
        }

        .surve_title_box {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .surve_title_box>img {
            width: 120px;
            height: 120px;
        }

        .surve_title1 {
            font-family: 'A2z';
            font-size: 40px;
            font-weight: 400;
            color: #111111;
            margin: 0;
        }

        .surve_title2 {
            font-family: 'A2z';
            font-size: 24px;
            font-weight: 400;
            margin: 0;
            background: linear-gradient(90deg,
                    #0700D2 0%,
                    #D20073 50%,
                    #FFFF60 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .surve_desc {
            font-family: 'A2z';
            font-size: 20px;
            font-weight: 300;
            color: #505050;
            margin: 0;
        }

        .surve_bottom {
            display: flex;
            justify-content: center;
        }

        .surve_bottom>img {
            width: 800px;
        }
    </style>
</head>

<body>

    <section class="surve_container">

        <div class="surve_wrapper">

            <div class="surve_box">

                <div class="surve_top">
                    <div class="surve_title_box">
                        <img src="https://ncryk7.mycafe24.com/tokena2.png" alt="">
                        <p class="surve_title1">칼럼 &amp; 뉴스</p>
                        <p class="surve_title2">Column &amp; News</p>
                    </div>

                    <p class="surve_desc">
                        디자인테이닝의 최신 정보를 만나보세요.
                    </p>
                </div>

                <div class="surve_bottom">
                    <img src="https://ncryk7.mycafe24.com/cnn1.png" alt="">
                </div>
            </div>

        </div>

    </section>

</body>

</html>
