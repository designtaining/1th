                title: '라이트 그레이 (Light Gray)',
                desc: '중립적, 모던함',
                desc2: '다른 색상을 방해하지 않으면서 화면을 정돈해줍니다. 깔끔하며 가장 인기가 많은 컬러중 하나입니다.'
            },
            {
                title: '화이트 (White)',
                desc: '깨끗함, 순수함, 여백, 미니멀함',
                desc2: '넓은 여백과 깨끗한 인상을 만들어 브랜드의 콘텐츠와 다른 색상을 더욱 선명하게 보여줍니다.'
            }
        ];


        bcColors.forEach((color, index) => {

            color.addEventListener('click', function () {

                /* 현재 CSS에 적용된 실제 색상을 가져옴 */
                const selectedColor =
                    window.getComputedStyle(this).backgroundColor;


                /* 컬러 카드 색상 변경 */
                colorcardLeft.style.backgroundColor = selectedColor;


                /* 텍스트 변경 */
                if (colorData[index]) {
                    colorcardTitle.textContent = colorData[index].title;
                    colorcardDesc.textContent = colorData[index].desc;
                    colorcardDesc2.textContent = colorData[index].desc2;
                }


                /* 선택 상태 초기화 */
                bcColors.forEach(item => {
                    item.classList.remove('active');
                });


                /* 현재 컬러 선택 */
                this.classList.add('active');

            });

        });


        /* =========================
           첫 번째 컬러 기본 선택
        ========================= */

        if (bcColors.length > 0 && colorData.length > 0) {

            bcColors[0].classList.add('active');

            const firstColor =
                window.getComputedStyle(bcColors[0]).backgroundColor;

            colorcardLeft.style.backgroundColor = firstColor;

            colorcardTitle.textContent = colorData[0].title;
            colorcardDesc.textContent = colorData[0].desc;
            colorcardDesc2.textContent = colorData[0].desc2;
        }
    </script>

</body>

</html>
